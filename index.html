<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a8c95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="xkelamkabut">
<title>xkelamkabut</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Icon set (line icons) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9Z"/><path d="M12 12v7a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-meal" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M6 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></symbol>
    <symbol id="i-rest" viewBox="0 0 24 24"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></symbol>
    <symbol id="i-transport" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></symbol>
    <symbol id="i-other" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  </defs>
</svg>

<header class="hero">
  <div class="kicker">xkelamkabut</div>
  <h1 id="tripTitle" contenteditable="true" spellcheck="false"></h1>
  <p id="tripDates"></p>
  <svg class="wave" viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M0,12 C20,2 35,20 55,10 C72,2 85,14 100,8 L100,20 L0,20 Z"/></svg>
</header>

<main>
  <section class="view on" id="v-itinerary">
    <div class="days" id="days"></div>
    <div class="dayhead" id="dayhead"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="view" id="v-bookings">
    <div class="empty">
      <div class="big"><svg class="ico"><use href="#i-plane"/></svg></div>
      <p><b>Bookings</b> is coming in step 2.</p>
      <p class="muted">Flights and hotels, with PDF upload.</p>
    </div>
  </section>
</main>

<nav class="tabs">
  <a href="#itinerary" data-v="itinerary" class="on"><svg class="ico"><use href="#i-calendar"/></svg>Itinerary</a>
  <a href="#bookings" data-v="bookings"><svg class="ico"><use href="#i-plane"/></svg>Bookings</a>
</nav>

<!-- Drawer -->
<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="grab"></div>

  <!-- Step 1: pick a card -->
  <div class="step" id="step1">
    <h3 id="pickTitle">Add at 8:00 am</h3>
    <div class="cards" id="cards"></div>
  </div>

  <!-- Step 2: fill in details -->
  <div class="step" id="step2">
  <div class="stephead">
    <button type="button" class="back" id="back" aria-label="Back"><svg class="ico"><use href="#i-back"/></svg></button>
    <span class="badge" id="badge"></span>
    <h3 id="drawerTitle">New item</h3>
  </div>
  <form id="itemForm" autocomplete="off">
    <label>Title<input name="title" placeholder="e.g. Beach" required></label>
    <div class="two">
      <label>Start<input name="start" type="time" required></label>
      <label>End <span class="muted">(optional)</span><input name="end" type="time"></label>
    </div>
    <label>Google Maps link <span class="muted">(optional)</span><input name="maps" type="url" inputmode="url" placeholder="Paste a maps.app.goo.gl link"></label>
    <label>Notes <span class="muted">(optional)</span><textarea name="notes" rows="3" placeholder="Booking ref, what to order, reminders…"></textarea></label>
    <div class="actions">
      <button type="button" class="btn ghost danger" id="delItem">Delete</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
  </div>
</div>

<!-- Day menu -->
<div class="drawer small" id="dayMenu" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3>Day options</h3>
  <form id="dayForm">
    <label>Label<input name="label" placeholder="e.g. Arrive"></label>
    <label>Date<input name="date" type="date"></label>
    <div class="actions">
      <button type="button" class="btn ghost danger" id="delDay">Delete day</button>
      <button type="button" class="btn ghost" id="cancelDay">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
